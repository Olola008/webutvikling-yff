<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Budsjettkalkulator</title>
  </head>
  <body>
    <header>
      <h1>Mitt budsjett</h1>
      <p>Oversikt over pengene dine hver måned</p>
    </header>

    <main>
      <div class="budsjett">
        <h2>Inntekter</h2>
        <label for="inntekt">Beløp i kroner</label>
        <input id="inntekt" type="number" min="0" />

        <label for="inntektType">Type</label>
        <select id="inntektType">
          <option value="Lønn">Lønn</option>
          <option value="Støtte">Støtte</option>
          <option value="Annet">Annet</option>
        </select>

        <button id="inntektKnapp">Legg til inntekt</button>
      </div>

      <div class="budsjett">
        <h2>Utgifter</h2>
        <label for="utgift">Beløp i kroner</label>
        <input id="utgift" type="number" min="0" />

        <label for="utgiftType">Type</label>
        <select id="utgiftType">
          <option value="Mat">Mat</option>
          <option value="Husleie">Husleie</option>
          <option value="Transport">Transport</option>
        </select>

        <button id="utgiftKnapp">Legg til utgift</button>
      </div>

      <div class="resultat">
        <h2>Resultat</h2>
        <div>
          <span>Inntekter:</span>
          <strong id="inntektSum">0 kr</strong>
        </div>

        <div>
          <span>Utgifter:</span>
          <strong id="utgiftSum">0 kr</strong>
        </div>

        <div>
          <span>Saldo:</span>
          <strong id="saldo">0 kr</strong>
        </div>
        <ul id="postListe"></ul>

        <button id="skrivUt">Skriv ut budsjett</button>
        <button id="tømBudsjett">Tøm budsjett</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
